<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNPT eKYC Face Scan</title>
  <script src="./web-sdk-version-3.2.1.0.js"></script>
  <script src="./lib/VNPTQRBrowserApp.js"></script>
  <script src="./lib/VNPTBrowserSDKAppV4.1.0.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    #ekyc_sdk_intergrated {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
    }

    /* Style tweaks for VNPT SDK in modal */
    .vnpt-bg-white {
      background-color: transparent !important;
    }
  </style>
</head>

<body>
  <div id="ekyc_sdk_intergrated"></div>

  <script>
    // Callback when VNPT eKYC completes
    const CALL_BACK_END_FLOW = async (result) => {
      console.log('[VNPT eKYC SDK] Final Result:', result);

      if (result) {
        if (!result.client_session) {
          result.client_session = 'ANDROID_Web_1.0_Device_1.0.0_web_' + Date.now();
        }
        if (!result.token) {
          result.token = result.hash_img || ('vnpt-token-' + Date.now());
        }
        if (!result.liveness_face) {
          result.liveness_face = {
            liveness: 'PASSED',
            liveness_msg: 'Liveness 3D Oval verified via VNPT SDK',
            liveness_prob: 0.98
          };
        }
      }

      // Post message to parent window (React component)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'VNPT_EKYC_RESULT',
          data: result
        }, '*');
      }
    };

    // Callback for document result if triggered
    const CALL_BACK_DOCUMENT_RESULT = async (docResult) => {
      console.log('[VNPT eKYC SDK] Document Result:', docResult);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'VNPT_EKYC_DOC_RESULT',
          data: docResult
        }, '*');
      }
    };

    // Default VNPT Sandbox credentials
    const BACKEND_URL = 'https://sandbox-idg.vnpt.vn';
    const TOKEN_ID = '34fc6f00-544a-2b01-e063-1f08a30a6b6c';
    const TOKEN_KEY =
      'MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAIO3d/AUMnEboq355/IEJH4E5z0w6mWAzAMhid2Q0tSuWBd1ZYR70fq42qTeH1mif3aoB0HNQJl/FGm+FuUsx6cCAwEAAQ==';
    const ACCESS_TOKEN =
      'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0cmFuc2FjdGlvbl9pZCI6IjdhNjZlMmIxLTMzNjAtNGY1Yy1hOWY2LWUwY2Q0ZGUxMTQ2YyIsInN1YiI6IjNkMmVlZDJlLTJmYTUtMTFmMC05OTEyLTYzNTMxZGFmZDkwNyIsImF1ZCI6WyJyZXN0c2VydmljZSJdLCJ1c2VyX25hbWUiOiJ2YW5ob2FtMTBAZ21haWwuY29tIiwic2NvcGUiOlsicmVhZCJdLCJpc3MiOiJodHRwczovL2xvY2FsaG9zdCIsIm5hbWUiOiJ2YW5ob2FtMTBAZ21haWwuY29tIiwiZXhwIjoxNzc4MDYwNzEwLCJ1dWlkX2FjY291bnQiOiIzZDJlZWQyZS0yZmE1LTExZjAtOTkxMi02MzUzMWRhZmQ5MDciLCJhdXRob3JpdGllcyI6WyJVU0VSIl0sImp0aSI6ImM2NWJmMGM1LWUxNjAtNGNiOC1iZTM3LTRjZjg1NzEzNDc0ZCIsImNsaWVudF9pZCI6ImNsaWVudGFwcCJ9.ko1MiU3o-MGykcwxjTroTvhSHsQd-TOKygSsQGhPionRvhTg6wRJGRys2GMQRrGK3dkkofyG2bjSk2i-U0EhMnSrxWnrkEVR__TyNhjPWs00js1M_2NSWb2EB14L6z7s0cjIH-9KNGofTS3kqE3bj8TWQdGl_ZfQs-FJbtHwGItE1UAKguHwTNELnJoNTsIbqnvbyOL3zRWht6A6vtSvikVJLD67co_epEOpt4N1PWm7J5YkPufn8g49ID-Qnd9RK7ZEMprSznHDEteLsEKVaK1MrZDwruBvYy-v2IX7BXwZS-bqEUj3EqWOV8DRGk3XX5pMCg6v-Nbg25Uy5N9LkA';

    // Parse URL search params if custom mode requested
    const urlParams = new URLSearchParams(window.location.search);
    const flow = urlParams.get('flow') || 'FACE'; // 'FACE' for face-only, 'DOCUMENT_TO_FACE' for full
    const customToken = urlParams.get('token');
    const cloudUpload = urlParams.get('cloud') === 'true' && Boolean(customToken);

    const dataConfig = {
      BACKEND_URL,
      TOKEN_KEY,
      TOKEN_ID,
      ACCESS_TOKEN: customToken || ACCESS_TOKEN,
      CALL_BACK_END_FLOW,
      CALL_BACK_DOCUMENT_RESULT,
      HAS_BACKGROUND_IMAGE: false,
      MAX_SIZE_IMAGE: 1,
      SDK_FLOW: flow,
      DOCUMENT_TYPE_START: 4,
      LIST_TYPE_DOCUMENT: [-1, 4, 5, 6, 7],
      URL_WEB_OVAL: '/lib/web-oval.json',
      URL_MOBILE_OVAL: '/lib/mobile-oval.json',
      DEFAULT_LANGUAGE: 'vi',
      ENABLE_API_UPLOAD_IMAGE: cloudUpload,
      ENABLE_API_LIVENESS_FACE: cloudUpload,
      ENABLE_API_MASKED_FACE: cloudUpload,
      ENABLE_API_COMPARE_FACE: false,
      ENABLE_API_OCR_DOCUMENT: false,
      HAS_RESULT_SCREEN: false,
    };

    window.addEventListener('DOMContentLoaded', function () {
      if (window.SDK) {
        console.log('[VNPT eKYC SDK] Launching version:', window.SDK.getVersion());
        window.SDK.launch(dataConfig);
      } else {
        console.error('[VNPT eKYC SDK] window.SDK is not defined!');
      }
    });

    // Notify parent window when user closes or cancels inside iframe
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'PING') {
        window.parent.postMessage({ type: 'PONG' }, '*');
      }
    });
  </script>
</body>

</html>
